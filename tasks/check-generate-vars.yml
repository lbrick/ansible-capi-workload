---
- name: Check required variables for fleet entry generation
  assert:
    that:
      - cluster_name is defined
      - cluster_name != 'CAPI_CLUSTER_NAME'
      - cluster_namespace is defined
      - openstack_ssh_key is defined
      - openstack_ssh_key != 'NeSI_RDC_KEYPAIR_NAME'
      - kubernetes_version is defined
      - capi_image_name is defined
      - cluster_external_network_id is defined
      - cluster_network is defined
    fail_msg: "Missing or unset required variable — copy tests/test_vars.yml.example to set values"

- name: Check clouds.yaml exists
  stat:
    path: "{{ clouds_yaml_local_location }}"
  register: _clouds_yaml_stat

- name: Fail if clouds.yaml missing
  assert:
    that: _clouds_yaml_stat.stat.exists
    fail_msg: "clouds.yaml not found at {{ clouds_yaml_local_location }} — set clouds_yaml_local_location"

- name: Check GitLab token is provided
  assert:
    that:
      - cluster_repo_gitlab_token is defined
      - cluster_repo_gitlab_token | length > 0
    fail_msg: "cluster_repo_gitlab_token must be set — provide a GitLab deploy/personal access token"

- name: Check sops age key file exists
  stat:
    path: "{{ sops_age_key_file }}"
  register: _sops_key_stat

- name: Fail if sops age key file missing
  assert:
    that: _sops_key_stat.stat.exists
    fail_msg: "SOPS age key file not found at {{ sops_age_key_file }} — set sops_age_key_file"
