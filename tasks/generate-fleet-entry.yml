---
# ── Read and parse clouds.yaml ──────────────────────────────────────────────

- name: Read clouds.yaml
  slurp:
    src: "{{ clouds_yaml_local_location }}"
  register: _clouds_yaml_slurp

- name: Parse clouds.yaml and extract credentials
  set_fact:
    _clouds_yaml_raw: "{{ _clouds_yaml_slurp.content | b64decode }}"
    _clouds_data: "{{ _clouds_yaml_slurp.content | b64decode | from_yaml }}"

- name: Set cloud credential facts
  set_fact:
    _auth_url: "{{ _clouds_data.clouds[clouds_yaml_cloud].auth.auth_url }}"
    _app_cred_id: "{{ _clouds_data.clouds[clouds_yaml_cloud].auth.application_credential_id }}"
    _app_cred_secret: "{{ _clouds_data.clouds[clouds_yaml_cloud].auth.application_credential_secret }}"
    _region: "{{ _clouds_data.clouds[clouds_yaml_cloud].region_name | default('akl-1') }}"

- name: Build CCM cloud.conf base64
  set_fact:
    _ccm_cloud_conf_b64: "{{ lookup('template', role_path + '/templates/gitops/ccm-cloud-conf.j2') | b64encode }}"

# ── Extract SOPS age recipient from key file ────────────────────────────────

- name: Read age key file
  slurp:
    src: "{{ sops_age_key_file }}"
  register: _age_key_file

- name: Extract age public key
  set_fact:
    _age_recipient: "{{ _age_key_file.content | b64decode | regex_search('# public key: (age1\\S+)', '\\1') | first }}"

# ── Set output directories ──────────────────────────────────────────────────

- name: Set output directories
  set_fact:
    _cluster_dir: "{{ fleet_output_dir }}/{{ cluster_name }}"
    _fleet_entry_dir: "{{ fleet_output_dir }}/{{ cluster_name }}-fleet-entry"

- name: Create output directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ _cluster_dir }}/config"
    - "{{ _cluster_dir }}/config/autoscaler"
    - "{{ _cluster_dir }}/config/secgroups"
    - "{{ _fleet_entry_dir }}"

# ── CAPI cluster manifests ──────────────────────────────────────────────────

- name: Render namespace.yaml
  template:
    src: gitops/namespace.yaml.j2
    dest: "{{ _cluster_dir }}/config/namespace.yaml"

- name: Render cluster.yaml
  template:
    src: gitops/cluster.yaml.j2
    dest: "{{ _cluster_dir }}/config/cluster.yaml"

- name: Render control-plane.yaml
  template:
    src: gitops/control-plane.yaml.j2
    dest: "{{ _cluster_dir }}/config/control-plane.yaml"

- name: Render workers.yaml
  template:
    src: gitops/workers.yaml.j2
    dest: "{{ _cluster_dir }}/config/workers.yaml"

- name: Render healthchecks.yaml
  template:
    src: gitops/healthchecks.yaml.j2
    dest: "{{ _cluster_dir }}/config/healthchecks.yaml"

- name: Render cluster-resource-set.yaml
  template:
    src: gitops/cluster-resource-set.yaml.j2
    dest: "{{ _cluster_dir }}/config/cluster-resource-set.yaml"

- name: Render cloud-config.plain.yaml
  template:
    src: gitops/cloud-config.plain.yaml.j2
    dest: "{{ _cluster_dir }}/config/cloud-config.plain.yaml"

- name: Encrypt cloud-config.yaml
  command: >-
    sops --age {{ _age_recipient }}
    --output {{ _cluster_dir }}/config/cloud-config.yaml
    -e {{ _cluster_dir }}/config/cloud-config.plain.yaml

# - name: Remove cloud-config.plain.yaml
#   file:
#     path: "{{ _cluster_dir }}/config/cloud-config.plain.yaml"
#     state: absent

- name: Render ccm-cloud-config.plain.yaml
  template:
    src: gitops/ccm-cloud-config.plain.yaml.j2
    dest: "{{ _cluster_dir }}/config/ccm-cloud-config.plain.yaml"

- name: Encrypt ccm-cloud-config.yaml
  command: >-
    sops --age {{ _age_recipient }}
    --output {{ _cluster_dir }}/config/ccm-cloud-config.yaml
    -e {{ _cluster_dir }}/config/ccm-cloud-config.plain.yaml

# - name: Remove ccm-cloud-config.plain.yaml
#   file:
#     path: "{{ _cluster_dir }}/config/ccm-cloud-config.plain.yaml"
#     state: absent

- name: Render config/kustomization.yaml
  template:
    src: gitops/config-kustomization.yaml.j2
    dest: "{{ _cluster_dir }}/config/kustomization.yaml"

# ── Autoscaler ──────────────────────────────────────────────────────────────

- name: Render autoscaler.yaml
  template:
    src: gitops/autoscaler.yaml.j2
    dest: "{{ _cluster_dir }}/config/autoscaler/autoscaler.yaml"

- name: Render autoscaler/kustomization.yaml
  template:
    src: gitops/autoscaler-kustomization.yaml.j2
    dest: "{{ _cluster_dir }}/config/autoscaler/kustomization.yaml"

# ── Terraform security groups ───────────────────────────────────────────────

- name: Render secgroups/main.tf
  template:
    src: gitops/secgroups-main.tf.j2
    dest: "{{ _cluster_dir }}/config/secgroups/main.tf"

- name: Render secgroups/variables.tf
  template:
    src: gitops/secgroups-variables.tf.j2
    dest: "{{ _cluster_dir }}/config/secgroups/variables.tf"

- name: Copy secgroups/versions.tf
  copy:
    src: gitops/secgroups-versions.tf
    dest: "{{ _cluster_dir }}/config/secgroups/versions.tf"

# ── Flux resources (cluster repo root) ─────────────────────────────────────

- name: Render root kustomization.yaml
  template:
    src: gitops/kustomization-root.yaml.j2
    dest: "{{ _cluster_dir }}/kustomization.yaml"

- name: Render ks.yaml
  template:
    src: gitops/ks.yaml.j2
    dest: "{{ _cluster_dir }}/ks.yaml"

- name: Render secgroups-tf.yaml
  template:
    src: gitops/secgroups-tf.yaml.j2
    dest: "{{ _cluster_dir }}/secgroups-tf.yaml"

# ── Fleet repo entry (clusters/workload/<cluster_name>/) ────────────────────

- name: Render fleet entry gitrepo.yaml
  template:
    src: gitops/fleet-gitrepo.yaml.j2
    dest: "{{ _fleet_entry_dir }}/gitrepo.yaml"

- name: Render fleet entry ks.yaml
  template:
    src: gitops/fleet-ks.yaml.j2
    dest: "{{ _fleet_entry_dir }}/ks.yaml"

- name: Render fleet entry kustomization.yaml
  template:
    src: gitops/fleet-kustomization.yaml.j2
    dest: "{{ _fleet_entry_dir }}/kustomization.yaml"

- name: Render gitlab-token-secret.plain.yaml
  template:
    src: gitops/gitlab-token-secret.plain.yaml.j2
    dest: "{{ _fleet_entry_dir }}/gitlab-token-secret.plain.yaml"

- name: Encrypt gitlab-token-secret.yaml
  command: >-
    sops --age {{ _age_recipient }}
    --output {{ _fleet_entry_dir }}/gitlab-token-secret.yaml
    -e {{ _fleet_entry_dir }}/gitlab-token-secret.plain.yaml

- name: Remove gitlab-token-secret.plain.yaml
  file:
    path: "{{ _fleet_entry_dir }}/gitlab-token-secret.plain.yaml"
    state: absent

# ── Management cluster workload-ks snippet ──────────────────────────────────

- name: Render workload-ks entry snippet
  template:
    src: gitops/workload-ks-entry.yaml.j2
    dest: "{{ fleet_output_dir }}/{{ cluster_name }}-workload-ks-entry.yaml"

# ── Next steps ──────────────────────────────────────────────────────────────

- name: Next steps
  debug:
    msg:
      - "Output: {{ fleet_output_dir }}"
      - ""
      - "Cluster repo files: {{ _cluster_dir }}"
      - "  → Commit as own Git repo OR copy into fleet repo at {{ fleet_cluster_path }}"
      - ""
      - "Fleet entry files: {{ _fleet_entry_dir }}"
      - "  → Copy into fleet repo at {{ fleet_cluster_path }}"
      - ""
      - "Before committing:"
      - "  1. Append to fleet repo management/workload-ks.yaml:"
      - "     cat {{ fleet_output_dir }}/{{ cluster_name }}-workload-ks-entry.yaml >> clusters/management/workload-ks.yaml"
      - "  (cloud-config.yaml and ccm-cloud-config.yaml already SOPS-encrypted)"
